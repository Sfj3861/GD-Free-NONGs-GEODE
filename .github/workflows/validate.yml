name: Validate mod metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate mod metadata and product identity
        run: python scripts/validate_mod.py
